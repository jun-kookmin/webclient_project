      </div>

      <div class="season-grid">
        <!--
          season-card: 클릭 가능한 카드 버튼입니다.
          data-season 값은 JS가 어떤 계절 별자리 묶음을 보여줄지 찾는 키입니다.
        -->
        <button class="season-card spring" type="button" data-season="spring">
          <span class="season-name">봄</span>
          <strong>황소자리</strong>
          <span class="season-note">알데바란과 플레이아데스가 돋보이는 봄 황도 별자리</span>
          <span class="season-action">자세히 보기</span>
        </button>

        <button class="season-card summer" type="button" data-season="summer">
          <span class="season-name">여름</span>
          <strong>사자자리</strong>

        </button>

          <span class="season-action">자세히 보기</span>
        </button>

  <div class="modal" id="seasonModal">
    <!-- data-close-modal: JS가 이 속성을 가진 요소에 닫기 이벤트를 붙입니다. 배경 클릭으로 닫히게 됩니다. -->
    <div class="modal-backdrop" data-close-modal></div>

    <!-- modal-panel: 실제 팝업 내용입니다. -->
    <section class="modal-panel">
      <!-- modal-close: 닫기 버튼입니다. data-close-modal 덕분에 배경과 같은 닫기 함수를 씁니다. -->
      <button class="modal-close" type="button" aria-label="팝업 닫기" data-close-modal>&times;</button>
      <!-- 아래 세 요소는 JS의 openSeasonModal 함수가 선택한 계절 데이터로 채웁니다. -->
      <p class="modal-season" id="modalSeason"></p>
      <h2 id="modalTitle"></h2>
      <div class="modal-summary" id="modalSummary"></div>
    </section>
  </div>

  <!-- defer: HTML 요소를 먼저 만든 뒤 JS를 실행해서 querySelector가 요소를 찾을 수 있게 합니다. -->
  <script src="js/nav.js" defer></script>
  <script src="js/main.js" defer></script>
