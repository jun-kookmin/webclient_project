<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별자리 운세</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <!-- 헤더 -->
  <header class="site-header">
    <a class="logo" href="main.html" aria-label="메인 페이지로 이동">
      <img src="images/logo.svg" alt="" aria-hidden="true">
    </a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a class="nav-link" href="main.html">메인</a>
      <a class="nav-link" href="story.html">신화</a>
      <a class="nav-link" href="game.html">게임</a>
      <a class="nav-link is-current" href="form.html" aria-current="page">운세</a>
      <a class="nav-link" href="team.html">팀원</a>
    </nav>
  </header>

  <main>

    <!-- 페이지 타이틀 -->
    <section class="title-area">
      <h1 class="title-en">FORTUNE FROM THE STARS</h1>
      <p class="title-kr">생년월일을 입력하면 별이 당신의 오늘을 읽어드립니다</p>
    </section>

    <!-- 입력 폼 + 결과 출력 (2열) -->
    <div class="content">

      <!-- 입력 폼 -->
      <section class="card form-card">
        <div class="card-head">
          <span class="card-num">01</span>
          <div>
            <h2 class="card-title-en">INPUT PANEL</h2>
            <p class="card-title-kr">관측 대상의 생년월일을 입력하세요</p>
          </div>
        </div>

        <form id="zodiacForm" class="form">
          <div class="field">
            <label for="birthdate">DATE OF BIRTH / 생년월일</label>
            <input type="date" id="birthdate" name="birthdate" required>
          </div>

          <div class="field">
            <label for="nickname">CALL SIGN / 닉네임 <span class="optional">(선택)</span></label>
            <input type="text" id="nickname" name="nickname" maxlength="10" placeholder="우주에서 불릴 이름">
          </div>

          <button type="submit" class="submit-btn">
            <span>별자리 관측 시작</span>
            <span class="arrow">→</span>
          </button>

          <p class="hint">* 결과는 새로 관측할 때마다 달라질 수 있어요</p>
        </form>
      </section>

      <!-- 결과 출력 -->
      <section class="card result-card" id="result">
        <div class="card-head">
          <span class="card-num">02</span>
          <div>
            <h2 class="card-title-en">OBSERVATION RESULT</h2>
            <p class="card-title-kr">관측 결과가 여기에 표시됩니다</p>
          </div>
        </div>

        <!-- 결과 입력 전 안내 -->
        <div class="result-empty" id="resultEmpty">
          <div class="empty-icon">✦</div>
          <p class="empty-text">왼쪽 패널에 정보를 입력하면<br>별이 당신의 운세를 알려줘요</p>
        </div>

        
        <div class="result-show" id="resultShow"></div>
      </section>

    </div>

  </main>

  <script src="js/form.js"></script>
</body>
</html>
